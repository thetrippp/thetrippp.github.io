<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAKERDLE</title>
  <style>
    :root {
      --t1-red: #E2012D;
      --t1-black: #0B0B0C;
      --t1-charcoal: #17181A;
      --gold: #C9A227;
      --tile-empty: #232427;
      --tile-border: #3a3b3e;
      --absent: #2b2c2f;
      --present: var(--gold);
      --correct: var(--t1-red);
      --text: #F2F1EE;
      --text-dim: #8b8c90;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(226, 1, 45, 0.18), transparent 60%),
        var(--t1-black);
      color: var(--text);
      font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    header {
      width: 100%;
      max-width: 460px;
      text-align: center;
      border-bottom: 1px solid var(--tile-border);
      padding-bottom: 14px;
      margin-bottom: 22px;
      position: relative;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.35em;
      color: var(--gold);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 0.04em;
      font-style: italic;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff, #d8d8d8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 26px rgba(226, 1, 45, 0.25);
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: 0.02em;
    }

    #board {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 22px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 56px);
      gap: 8px;
    }

    .tile {
      width: 56px;
      height: 56px;
      border: 2px solid var(--tile-border);
      background: var(--tile-empty);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text);
      border-radius: 3px;
      transition: transform 0.15s ease;
    }

    .tile.filled {
      border-color: #55565a;
      transform: scale(1.03);
    }

    .tile.flip {
      animation: flip 0.55s ease forwards;
    }

    @keyframes flip {
      0% {
        transform: rotateX(0deg);
      }

      50% {
        transform: rotateX(90deg);
      }

      51% {
        transform: rotateX(90deg);
      }

      100% {
        transform: rotateX(0deg);
      }
    }

    .tile.correct {
      background: var(--correct);
      border-color: var(--correct);
      color: #fff;
    }

    .tile.present {
      background: var(--present);
      border-color: var(--present);
      color: #1a1400;
    }

    .tile.absent {
      background: var(--absent);
      border-color: var(--absent);
      color: var(--text-dim);
    }

    .tile.shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {

      10%,
      90% {
        transform: translateX(-2px);
      }

      20%,
      80% {
        transform: translateX(4px);
      }

      30%,
      50%,
      70% {
        transform: translateX(-8px);
      }

      40%,
      60% {
        transform: translateX(8px);
      }
    }

    #message {
      min-height: 26px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #message.show {
      opacity: 1;
    }

    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 480px;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .key {
      background: #2c2d30;
      color: var(--text);
      border: none;
      border-radius: 4px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      padding: 0;
      height: 44px;
      min-width: 30px;
      flex: 1;
      max-width: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
      user-select: none;
    }

    .key:active {
      transform: scale(0.95);
    }

    .key.wide {
      max-width: 64px;
      font-size: 10px;
      letter-spacing: 0.03em;
    }

    .key.correct {
      background: var(--correct);
      color: #fff;
    }

    .key.present {
      background: var(--present);
      color: #1a1400;
    }

    .key.absent {
      background: #1c1d1f;
      color: #55565a;
    }

    footer {
      margin-top: 26px;
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    #streakDisplay {
      margin-top: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: var(--gold);
      text-align: center;
    }

    #streakDisplay.broken {
      color: var(--text-dim);
    }

    #lossQuote {
      max-width: 460px;
      margin: 14px auto 0;
      padding: 0 16px;
      text-align: center;
      font-size: 12px;
      font-style: italic;
      color: var(--text-dim);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #lossQuote.show {
      opacity: 1;
    }

    .crown {
      position: absolute;
      right: 0;
      top: -4px;
      font-size: 20px;
      opacity: 0.85;
    }

    #winOverlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      z-index: 999;
      overflow: hidden;
    }

    #winOverlay.show {
      display: flex;
    }

    #winBackdrop {
      position: absolute;
      inset: -20px;
      background-size: cover;
      background-position: center;
      filter: blur(30px) brightness(0.35) saturate(1.1);
      transform: scale(1.1);
    }

    #winOverlay::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.65) 85%);
    }

    #winGrid {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    #winGrid img {
      max-width: 96vw;
      max-height: 88vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
    }

    #winOverlay .loss-caption {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      font-size: 14px;
    }

    @media (max-width: 380px) {
      .tile {
        width: 48px;
        height: 48px;
        font-size: 24px;
      }

      .row {
        grid-template-columns: repeat(5, 48px);
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="eyebrow" id="titleTop1"></div>
    <h1>FAKERDLE</h1>
    <div class="crown">👑</div>
    <div class="subtitle" id="titleTop2"></div>
  </header>

  <div id="board"></div>
  <div id="message"></div>
  <div id="keyboard"></div>

  <footer>The answer has never changed since Season 3.</footer>
  <div id="streakDisplay">🔥 <span id="streakCount">0</span> DAY STREAK</div>
  <div id="lossQuote"></div>

  <div id="winOverlay">
    <div id="winBackdrop"></div>
    <div id="winGrid"></div>
    <div class="loss-caption">as expected</div>
  </div>

  <script>
    const ANSWER = "FAKER";
    const MAX_GUESSES = 6;
    const WORD_LENGTH = 5;

    let currentGuess = "";
    let guesses = [];
    let gameOver = false;

    const board = document.getElementById('board');
    const messageEl = document.getElementById('message');
    const keyboardEl = document.getElementById('keyboard');

    const keyState = {}; // letter -> 'correct' | 'present' | 'absent'

    // Add as many image filenames as you like — they'll be placed in the outputs
    // folder alongside this HTML file, so just reference them by filename here.
    // These now display on a WIN, filling the screen without distortion.
    const WIN_IMAGES = [
      "faker-calling.gif",
      "faker-shush.gif"
    ];

    function showWinOverlay() {
      const overlay = document.getElementById('winOverlay');
      const grid = document.getElementById('winGrid');
      const backdrop = document.getElementById('winBackdrop');

      if (WIN_IMAGES.length === 0) {
        overlay.classList.add('show');
        return;
      }

      const src = WIN_IMAGES[Math.floor(Math.random() * WIN_IMAGES.length)];

      grid.innerHTML = "";
      const img = document.createElement('img');
      img.src = src;
      img.alt = "";
      grid.appendChild(img);

      backdrop.style.backgroundImage = `url("${src}")`;

      overlay.classList.add('show');
    }

    // Quotes shown at the bottom of the page on a loss. Add as many as you like.
    const LOSS_QUOTES = [
      '"How do you lose to Faker? He is literally the only answer."',
      '"Every game is winnable. This one, somehow, was not."',
      '"You had six tries. Six. It is a five-letter word."',
      '"Somewhere, Faker is not surprised."',
      '"This is why they call it the Unkillable Demon King."'
    ];

    function showLossQuote() {
      const el = document.getElementById('lossQuote');
      const quote = LOSS_QUOTES[Math.floor(Math.random() * LOSS_QUOTES.length)];
      el.textContent = quote;
      el.classList.add('show');
    }

    const TITLES = [
      "UNKILLABLE DEMON KING",
      "FIRST INDUCTEE INTO THE HALL OF LEGENDS",
      "GREATEST OF ALL TIME",
      "HIDE ON BUSH",
      "T1 FAKER",
      "SKT T1 FAKER",
      'LEE "FAKER" SANG-HYEOK',
      "6-TIME WORLD CHAMPION",
      "THE FACE OF LEAGUE OF LEGENDS",
      "GOAT OF ESPORTS",
      "THE ZED PLAYER YOUR ZED PLAYER FEARS"
    ];

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const shuffledTitles = shuffle(TITLES);
    const [topTitle1, topTitle2, winTitle] = shuffledTitles;

    document.getElementById('titleTop1').textContent = topTitle1;
    document.getElementById('titleTop2').textContent = topTitle2;

    // --- Streak tracking ---
    // NOTE: uses localStorage, which only persists when this file is opened
    // directly in a browser or hosted somewhere. It will not work inside
    // Claude.ai's in-chat artifact preview, since that runs in a sandboxed
    // iframe that blocks storage APIs — open the downloaded file itself.

    const STREAK_KEY = 'fakerdle_streak';
    const LAST_WIN_KEY = 'fakerdle_lastWinDate';
    let memoryStreak = 0; // fallback if localStorage is unavailable

    function dateStr(d) {
      return d.toISOString().slice(0, 10);
    }

    function safeGet(key) {
      try { return localStorage.getItem(key); }
      catch (e) { return null; }
    }

    function safeSet(key, value) {
      try { localStorage.setItem(key, value); }
      catch (e) { /* storage unavailable, e.g. sandboxed preview */ }
    }

    function renderStreak(count, broken) {
      document.getElementById('streakCount').textContent = count;
      document.getElementById('streakDisplay').classList.toggle('broken', !!broken);
    }

    function initStreak() {
      const today = dateStr(new Date());
      const yesterday = dateStr(new Date(Date.now() - 86400000));
      let streak = parseInt(safeGet(STREAK_KEY) || '0', 10);
      const lastWin = safeGet(LAST_WIN_KEY);

      if (lastWin && lastWin !== today && lastWin !== yesterday) {
        // a day was missed since the last win — streak is broken
        streak = 0;
        safeSet(STREAK_KEY, '0');
      }

      memoryStreak = streak;
      renderStreak(streak, streak === 0);
    }

    function recordWinStreak() {
      const today = dateStr(new Date());
      const yesterday = dateStr(new Date(Date.now() - 86400000));
      let streak = parseInt(safeGet(STREAK_KEY) || '0', 10);
      const lastWin = safeGet(LAST_WIN_KEY);

      if (lastWin === today) {
        // already won today, streak already counted
      } else if (lastWin === yesterday) {
        streak += 1;
      } else {
        streak = 1;
      }

      safeSet(STREAK_KEY, String(streak));
      safeSet(LAST_WIN_KEY, today);
      memoryStreak = streak;
      renderStreak(streak, false);
    }

    initStreak();

    function buildBoard() {
      for (let r = 0; r < MAX_GUESSES; r++) {
        const row = document.createElement('div');
        row.className = 'row';
        row.id = 'row-' + r;
        for (let c = 0; c < WORD_LENGTH; c++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.id = `tile-${r}-${c}`;
          row.appendChild(tile);
        }
        board.appendChild(row);
      }
    }

    const KB_ROWS = [
      "QWERTYUIOP".split(""),
      "ASDFGHJKL".split(""),
      ["ENTER", ..."ZXCVBNM".split(""), "BACK"]
    ];

    function buildKeyboard() {
      KB_ROWS.forEach(rowKeys => {
        const rowEl = document.createElement('div');
        rowEl.className = 'kb-row';
        rowKeys.forEach(k => {
          const btn = document.createElement('button');
          btn.className = 'key' + (k.length > 1 ? ' wide' : '');
          btn.textContent = k === 'BACK' ? '⌫' : k;
          btn.id = 'key-' + k;
          btn.addEventListener('click', () => handleKey(k));
          rowEl.appendChild(btn);
        });
        keyboardEl.appendChild(rowEl);
      });
    }

    function showMessage(text, persist) {
      messageEl.textContent = text;
      messageEl.classList.add('show');
      if (!persist) {
        setTimeout(() => {
          if (!gameOver) messageEl.classList.remove('show');
        }, 1600);
      }
    }

    function handleKey(k) {
      if (gameOver) return;
      if (k === 'ENTER') {
        submitGuess();
      } else if (k === 'BACK') {
        currentGuess = currentGuess.slice(0, -1);
        renderCurrentRow();
      } else if (/^[A-Z]$/.test(k) && currentGuess.length < WORD_LENGTH) {
        currentGuess += k;
        renderCurrentRow();
      }
    }

    function renderCurrentRow() {
      const r = guesses.length;
      for (let c = 0; c < WORD_LENGTH; c++) {
        const tile = document.getElementById(`tile-${r}-${c}`);
        const letter = currentGuess[c] || "";
        tile.textContent = letter;
        tile.classList.toggle('filled', !!letter);
      }
    }

    function shakeRow(r) {
      const row = document.getElementById('row-' + r);
      row.querySelectorAll('.tile').forEach(t => {
        t.classList.add('shake');
        setTimeout(() => t.classList.remove('shake'), 400);
      });
    }

    function submitGuess() {
      if (currentGuess.length !== WORD_LENGTH) {
        showMessage("NOT ENOUGH LETTERS");
        shakeRow(guesses.length);
        return;
      }

      const r = guesses.length;
      const guessArr = currentGuess.split("");
      const answerArr = ANSWER.split("");
      const result = new Array(WORD_LENGTH).fill('absent');
      const answerUsed = new Array(WORD_LENGTH).fill(false);

      // pass 1: correct
      for (let i = 0; i < WORD_LENGTH; i++) {
        if (guessArr[i] === answerArr[i]) {
          result[i] = 'correct';
          answerUsed[i] = true;
        }
      }
      // pass 2: present
      for (let i = 0; i < WORD_LENGTH; i++) {
        if (result[i] === 'correct') continue;
        const idx = answerArr.findIndex((ch, j) => ch === guessArr[i] && !answerUsed[j]);
        if (idx !== -1) {
          result[i] = 'present';
          answerUsed[idx] = true;
        }
      }

      // animate flip then apply colors
      for (let c = 0; c < WORD_LENGTH; c++) {
        const tile = document.getElementById(`tile-${r}-${c}`);
        setTimeout(() => {
          tile.classList.add('flip');
          setTimeout(() => {
            tile.classList.add(result[c]);
            updateKeyState(guessArr[c], result[c]);
          }, 275);
        }, c * 220);
      }

      guesses.push(currentGuess);
      const guessCount = guesses.length;
      const won = currentGuess === ANSWER;
      const totalDelay = WORD_LENGTH * 220 + 400;

      setTimeout(() => {
        if (won) {
          gameOver = true;
          showMessage(winTitle, true);
          recordWinStreak();
          showWinOverlay();
        } else if (guessCount >= MAX_GUESSES) {
          gameOver = true;
          showMessage("IT WAS ALWAYS FAKER. HOW.", true);
          showLossQuote();
        } else {
          currentGuess = "";
        }
      }, totalDelay);
    }

    function updateKeyState(letter, state) {
      const rank = { absent: 0, present: 1, correct: 2 };
      if (!keyState[letter] || rank[state] > rank[keyState[letter]]) {
        keyState[letter] = state;
        const keyEl = document.getElementById('key-' + letter);
        if (keyEl) {
          keyEl.classList.remove('correct', 'present', 'absent');
          keyEl.classList.add(state);
        }
      }
    }

    document.addEventListener('keydown', (e) => {
      if (gameOver) return;
      const k = e.key.toUpperCase();
      if (k === 'ENTER') handleKey('ENTER');
      else if (k === 'BACKSPACE') handleKey('BACK');
      else if (/^[A-Z]$/.test(k)) handleKey(k);
    });

    buildBoard();
    buildKeyboard();
    renderCurrentRow();
  </script>

</body>

</html>
